<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>응답되었습니다</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f7f5;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont,
        "Noto Sans KR", sans-serif;
      text-align: center;
    }

    main { max-width: 440px; }

    h1 {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -1px;
    }

    p {
      margin-top: 14px;
      color: #777;
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <main>
    <h1>응답되었습니다</h1>
    <p>응답이 제출되었습니다.</p>
  </main>
</body>
</html>
