<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * { box-sizing: border-box; }

    :root {
      --paper: #fdfdfb;
      --ink: #252520;
      --muted: #92928b;
      --line: #d4d4ce;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Sans KR", Arial, sans-serif;
    }

    header {
      padding: 34px 3.5vw 20px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 20px;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: .22em;
      color: #77776f;
      margin-bottom: 18px;
    }

    h1 {
      font-size: clamp(31px, 4.4vw, 52px);
      font-weight: 400;
      letter-spacing: -.06em;
      margin: 0;
    }

    .description {
      font-size: 12px;
      line-height: 2;
      color: #818179;
      margin: 20px 0 0;
    }

    .meta {
      color: var(--muted);
      font-size: 10px;
      line-height: 2;
      text-align: right;
      white-space: nowrap;
    }

    .live-dot {
      display: inline-block;
      width: 6px;
      height: 6px;
      background: #999990;
      border-radius: 50%;
      margin-right: 5px;
      vertical-align: middle;
    }

    #status {
      margin: 22px 3.5vw 0;
      font-size: 10px;
      color: #999990;
      min-height: 15px;
    }

    #viewport {
      width: 100%;
      height: min(69vh, 760px);
      min-height: 430px;
      overflow: auto;
      scrollbar-width: thin;
      scrollbar-color: #deded8 transparent;
      cursor: grab;
    }

    #viewport:active { cursor: grabbing; }

    #scene {
      position: relative;
      width: 100%;
      min-width: 850px;
      height: 100%;
      min-height: 430px;
    }

    #connections {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }

    .edge {
      fill: none;
      stroke: var(--line);
      stroke-width: 1;
      vector-effect: non-scaling-stroke;
    }

    .edge-dot {
      fill: #bcbcb4;
    }

    .node {
      position: absolute;
      transform: translate(-50%, -50%);
      width: clamp(112px, 10.5vw, 150px);
      aspect-ratio: 1;
      border: 1px solid #d6d6d0;
      border-radius: 50%;
      background: rgba(253,253,251,.96);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 17px;
      text-align: center;
      gap: 8px;
      cursor: pointer;
      transition: border-color .3s, box-shadow .3s, background .3s;
      z-index: 1;
    }

    .node:hover,
    .node:focus-visible {
      outline: none;
      border-color: #8c8c80;
      box-shadow: 0 0 25px rgba(0,0,0,.045);
      background: white;
    }

    .node.mine {
      border-color: #9b9b90;
      box-shadow: 0 0 28px rgba(0,0,0,.045);
    }

    .node-index {
      font-size: 10px;
      color: #77776f;
      letter-spacing: .08em;
    }

    .node-text {
      font-size: clamp(10px, 1vw, 13px);
      line-height: 1.75;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .node-time {
      font-size: 9px;
      color: #999990;
    }

    #detail {
      position: fixed;
      z-index: 5;
      left: 50%;
      bottom: 56px;
      transform: translateX(-50%);
      width: min(420px, 88vw);
      padding: 22px 26px;
      border: 1px solid #deded8;
      background: rgba(253,253,251,.97);
      box-shadow: 0 12px 50px rgba(0,0,0,.055);
      display: none;
    }

    #detail.visible { display: block; }

    #detail-label {
      font-size: 10px;
      color: #92928b;
      margin-bottom: 12px;
    }

    #detail-text {
      font-size: 14px;
      line-height: 1.9;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    #detail-close {
      position: absolute;
      right: 12px;
      top: 10px;
      border: 0;
      background: none;
      color: #77776f;
      cursor: pointer;
      font-size: 17px;
    }

    footer {
      padding: 18px 3.5vw 24px;
      border-top: 1px solid #eeeeea;
      display: flex;
      justify-content: space-between;
      gap: 16px;
      color: #999990;
      font-size: 10px;
      line-height: 1.8;
    }

    footer a {
      color: #68685f;
      text-decoration: none;
    }

    @media (max-width: 600px) {
      header { padding: 26px 6vw 18px; }
      .meta { font-size: 9px; }
      .description { font-size: 11px; }
      #status { margin-left: 6vw; }
      #viewport { height: 65vh; }
      #scene { min-width: 850px; }
      footer { padding: 16px 6vw 22px; }
    }
  </style>
</head>

<body>
  <header>
    <div>
      <div class="eyebrow">A CONTINUOUS RESPONSE</div>
      <h1>응답과 응답 사이</h1>
      <p class="description">
        하나의 응답은 다음 응답과 연결된다.<br>
        연결은 계속되고, 아직 도착하지 않은 응답은 열려 있다.
      </p>
    </div>

    <div class="meta">
      <div id="count">0개의 응답</div>
      <div><span class="live-dot"></span>실시간 업데이트</div>
    </div>
  </header>

  <div id="status">연결망을 불러오는 중...</div>

  <main id="viewport">
    <div id="scene">
      <svg id="connections" aria-hidden="true"></svg>
    </div>
  </main>

  <div id="detail" role="dialog" aria-live="polite">
    <button id="detail-close" aria-label="닫기">×</button>
    <div id="detail-label"></div>
    <div id="detail-text"></div>
  </div>

  <footer>
    <span>각 응답은 고유한 목소리로 남습니다.</span>
    <a id="writeLink" href="?">응답 남기기 ↗</a>
  </footer>

  <script src="config.js"></script>
  <script>
    const scene = document.getElementById("scene");
    const svg = document.getElementById("connections");
    const viewport = document.getElementById("viewport");
    const statusEl = document.getElementById("status");
    const count = document.getElementById("count");
    const detail = document.getElementById("detail");

    const params = new URLSearchParams(window.location.search);
    const myId = params.get("id") || "";

    let previousSignature = "";
    let firstRender = true;

    const NS = "http://www.w3.org/2000/svg";

    function el(tag, className, text) {
      const element = document.createElement(tag);
      if (className) element.className = className;
      if (text !== undefined) element.textContent = text;
      return element;
    }

    function svgEl(tag, attrs) {
      const element = document.createElementNS(NS, tag);
      Object.entries(attrs).forEach(([key, value]) => {
        element.setAttribute(key, value);
      });
      return element;
    }

    function formatTime(value) {
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return "";

      return date.toLocaleTimeString("ko-KR", {
        hour: "2-digit",
        minute: "2-digit",
        hour12: false
      });
    }

    // 연결 순서에 따라 노드를 여러 높이에 배치한다.
    // 실제 연결 관계는 previousId로 결정한다.
    function arrangeNodes(nodes, width, height) {
      const count = nodes.length;
      const positions = new Map();

      const columns = Math.max(1, Math.ceil(Math.sqrt(count * 1.5)));
      const rows = Math.ceil(count / columns);
      const cellWidth = width / (columns + 1);
      const cellHeight = Math.max(115, height / (rows + 1));

      nodes.forEach((node, index) => {
        const col = index % columns;
        const row = Math.floor(index / columns);

        // 격자에서 살짝 벗어나 자연스러운 흐름을 만든다.
        const seed = index * 2.399;
        const jitterX = Math.sin(seed) * cellWidth * 0.17;
        const jitterY = Math.cos(seed * 1.7) * cellHeight * 0.18;

        positions.set(node.id, {
          x: cellWidth * (col + 1) + jitterX,
          y: cellHeight * (row + 0.65) + jitterY
        });
      });

      return positions;
    }

    function showDetail(node, index) {
      document.getElementById("detail-label").textContent =
        "RESPONSE " + String(index + 1).padStart(3, "0") +
        " · " + formatTime(node.timestamp);

      document.getElementById("detail-text").textContent = node.text;
      detail.classList.add("visible");
    }

    document.getElementById("detail-close").addEventListener("click", () => {
      detail.classList.remove("visible");
    });

    function renderGraph(data) {
      if (!data || !data.ok || !Array.isArray(data.nodes)) {
        throw new Error("연결망 데이터를 읽을 수 없습니다.");
      }

      const nodes = data.nodes;
      count.textContent = nodes.length + "개의 응답";

      const signature = nodes
        .map(n => n.id + ":" + n.previousId + ":" + n.text)
        .join("|");

      if (signature === previousSignature) {
        statusEl.textContent = "연결망 업데이트 · " +
          new Date().toLocaleTimeString("ko-KR");
        return;
      }

      previousSignature = signature;

      // 화면 요소만 제거하고 SVG 연결선을 다시 만든다.
      scene.querySelectorAll(".node").forEach(n => n.remove());
      svg.replaceChildren();

      if (!nodes.length) {
        statusEl.textContent = "첫 번째 응답을 기다리고 있습니다.";
        return;
      }

      const width = Math.max(viewport.clientWidth, 850);
      const height = Math.max(viewport.clientHeight, 430);

      scene.style.width = width + "px";
      scene.style.height = height + "px";
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);

      const positions = arrangeNodes(nodes, width, height);
      const byId = new Map(nodes.map(n => [n.id, n]));

      // 연결선은 실제 저장된 이전 응답 ID를 따른다.
      nodes.forEach(node => {
        if (!node.previousId || !byId.has(node.previousId)) return;

        const a = positions.get(node.previousId);
        const b = positions.get(node.id);
        if (!a || !b) return;

        const dx = b.x - a.x;
        const dy = b.y - a.y;
        const bend = Math.min(65, Math.abs(dx) * 0.2);

        const direction = dx >= 0 ? 1 : -1;
        const path = [
          `M ${a.x} ${a.y}`,
          `C ${a.x + bend * direction} ${a.y + dy * 0.15},`,
          `${b.x - bend * direction} ${b.y - dy * 0.15},`,
          `${b.x} ${b.y}`
        ].join(" ");

        svg.appendChild(svgEl("path", {
          d: path,
          class: "edge"
        }));

        svg.appendChild(svgEl("circle", {
          cx: b.x,
          cy: b.y,
          r: 1.8,
          class: "edge-dot"
        }));
      });

      nodes.forEach((node, index) => {
        const p = positions.get(node.id);
        const card = el("button", "node");
        card.type = "button";
        card.style.left = p.x + "px";
        card.style.top = p.y + "px";
        card.setAttribute("aria-label", "응답 " + (index + 1));

        if (node.id === myId) card.classList.add("mine");

        card.appendChild(el(
          "div",
          "node-index",
          String(index + 1).padStart(2, "0")
        ));

        card.appendChild(el("div", "node-text", node.text));
        card.appendChild(el("div", "node-time", formatTime(node.timestamp)));

        card.addEventListener("click", () => showDetail(node, index));
        scene.appendChild(card);
      });

      statusEl.textContent =
        "응답들이 연결되고 있습니다 · " +
        new Date().toLocaleTimeString("ko-KR");

      // 첫 화면에서는 관객이 전체 구도를 볼 수 있도록 유지한다.
      // 새 응답이 추가되면 끝부분으로 이동한다.
      if (!firstRender) {
        const mine = nodes.find(n => n.id === myId);
        if (mine) {
          const p = positions.get(mine.id);
          viewport.scrollTo({
            left: Math.max(0, p.x - viewport.clientWidth / 2),
            behavior: "smooth"
          });
        }
      }

      firstRender = false;
    }

    let loading = false;

    function loadGraph() {
      if (typeof EXEC_URL === "undefined" || EXEC_URL.indexOf("script.google.com") === -1) {
        statusEl.textContent = "config.js에 Apps Script 웹 앱 주소(EXEC_URL)를 먼저 넣어 주세요.";
        return;
      }

      // 이전 요청이 끝나기 전에는 새 요청을 보내지 않는다.
      if (loading) return;
      loading = true;

      fetch(EXEC_URL + "?action=graph&t=" + Date.now())
        .then(function(res) { return res.json(); })
        .then(renderGraph)
        .catch(function(error) {
          console.error(error);
          statusEl.textContent = "연결망을 불러오지 못했습니다. " +
            (error && error.message ? error.message : "");
        })
        .finally(function() { loading = false; });
    }

    // 작성 화면(index.html)으로 돌아가는 링크
    document.getElementById("writeLink").href = "./";

    loadGraph();
    setInterval(loadGraph, 5000);

    window.addEventListener("resize", () => {
      // 화면 크기가 바뀌면 현재 연결망을 다시 그린다.
      previousSignature = "";
      loadGraph();
    });
  </script>
</body>
</html>
