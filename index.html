
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>응답해주세요</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #f7f7f5;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont,
        "Noto Sans KR", sans-serif;
    }

    main { width: 100%; max-width: 440px; }

    h1 {
      margin-bottom: 12px;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -1px;
    }

    p {
      margin-bottom: 28px;
      color: #777;
      line-height: 1.6;
    }

    textarea {
      width: 100%;
      min-height: 190px;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: white;
      font: inherit;
      font-size: 16px;
      resize: vertical;
      outline: none;
    }

    textarea:focus { border-color: #555; }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 16px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      font: inherit;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    #status {
      min-height: 24px;
      margin-top: 12px;
      font-size: 14px;
      color: #b42318;
    }
  </style>
</head>
<body>
  <main>
    <h1>응답해주세요</h1>
    <p>전달하고 싶은 응답을 작성해주세요.</p>

    <form id="responseForm">
      <textarea
        id="response"
        name="response"
        placeholder="응답을 입력해주세요."
        maxlength="5000"
        required
      ></textarea>

      <button id="submitButton" type="submit">전송</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>

    <iframe
      name="submitFrame"
      id="submitFrame"
      title="응답 제출"
      hidden
    ></iframe>
  </main>

  <script>
    // 배포한 Google Apps Script 웹 앱 URL을 입력하세요.
    const SCRIPT_URL = "YOUR_GOOGLE_SCRIPT_URL";

    const form = document.getElementById("responseForm");
    const button = document.getElementById("submitButton");
    const status = document.getElementById("status");
    const frame = document.getElementById("submitFrame");

    let submitting = false;
    let frameReady = false;

    frame.addEventListener("load", () => {
      if (!frameReady) {
        frameReady = true;
        return;
      }

      if (submitting) {
        window.location.href = "done.html";
      }
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();

      if (submitting) return;

      if (
        !SCRIPT_URL.startsWith("https://script.google.com/") ||
        SCRIPT_URL === "YOUR_GOOGLE_SCRIPT_URL"
      ) {
        status.textContent = "관리자 설정이 필요합니다.";
        return;
      }

      if (!form.response.value.trim()) {
        status.textContent = "응답 내용을 입력해주세요.";
        return;
      }

      submitting = true;
      button.disabled = true;
      button.textContent = "전송 중...";
      status.textContent = "";

      form.action = SCRIPT_URL;
      form.method = "POST";
      form.target = "submitFrame";
      form.submit();
    });
  </script>
</body>
</html>
