<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f5">
  <title>전시 <설명하지 않는다> 응답 아카이브 </title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f7f7f5;
      color: #222;
      font-family: Arial, "Noto Sans KR", sans-serif;
      overflow: hidden;
    }

    /* 점 + 점선 배경 */
    #web {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .node { fill: #222; }
    .node.fade { animation: pop .6s ease both; }
    .node.latest { animation: pop .6s ease both, pulse 2s ease-in-out .8s infinite; }
    .link {
      stroke: #222;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-dasharray: 1 7;
      opacity: .45;
    }
    .link.fade { animation: fadeLine .8s ease both; }

    @keyframes pop {
      from { opacity: 0; transform: scale(0); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: .35; }
    }
    @keyframes fadeLine {
      from { opacity: 0; }
      to   { opacity: .45; }
    }
    .node { transform-box: fill-box; transform-origin: center; }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      transition: opacity .6s ease, transform .6s ease;
    }
    main.hide {
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
    }

    h1 {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    .description {
      color: #777;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 200px;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
      font: inherit;
      font-size: 16px;
      line-height: 1.7;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: #555; }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 16px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: wait; }

    #status {
      min-height: 24px;
      margin-top: 12px;
      color: #b42318;
      font-size: 13px;
      line-height: 1.6;
    }

    /* 전송 후 문구 */
    #thanks {
      position: fixed;
      left: 0; right: 0; bottom: 12vh;
      z-index: 2;
      text-align: center;
      color: #555;
      font-size: 14px;
      line-height: 1.8;
      opacity: 0;
      transition: opacity 1s ease;
      pointer-events: none;
    }
    #thanks.show { opacity: 1; }
  </style>
</head>

<body>
  <svg id="web" aria-hidden="true"></svg>

  <main id="formWrap">
    <h1>이제 당신의 응답을 들려주세요.</h1>
    <div class="description">
      11월 3일부터 14일까지 전시<설명하지 않는다>를 관람한 관람객의 '응답'을 받아 수집합니다.
      긴장된 평화, 치열한 휴식. 당신은 어떻게 응답하시겠습니까?
     버팀 · 이해 · 균형 · 생존. 네 명의 작가는 각자의 방식으로 응답했습니다. 이제 당신의 응답을 들려주세요.

    </div>

    <form id="responseForm">
      <textarea
        id="response"
        name="response"
        maxlength="5000"
        placeholder="응답을 입력해주세요."
        required
      ></textarea>

      <button id="submitButton" type="submit">전송</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
  </main>

  <div id="thanks"></div>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbxOm-8YuZq9ratK6XxpY0rDaHTKAsN9xumeHzvdQh-37kZd59nWCaFRoVCDmbvmCBKe/exec";

    const MAX_NODES = 80; // 화면에 그릴 최대 점 개수 (최근 것만)
    const SVG_NS = "http://www.w3.org/2000/svg";

    const form = document.getElementById("responseForm");
    const input = document.getElementById("response");
    const button = document.getElementById("submitButton");
    const status = document.getElementById("status");
    const formWrap = document.getElementById("formWrap");
    const thanks = document.getElementById("thanks");
    const svg = document.getElementById("web");

    let submitting = false;
    let totalCount = 0; // 시트에 쌓인 응답 수

    /* ---------- 위치: 번호마다 항상 같은 자리 ---------- */
    function rand(seed) {
      // mulberry32 — 같은 번호면 항상 같은 값
      let t = (seed += 0x6d2b79f5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    function posOf(index) {
      const w = window.innerWidth, h = window.innerHeight;
      return {
        x: w * (0.06 + rand(index * 2 + 1) * 0.88),
        y: h * (0.08 + rand(index * 2 + 2) * 0.84)
      };
    }

    /* ---------- 그리기 ---------- */
    function makeNode(p, cls) {
      const c = document.createElementNS(SVG_NS, "circle");
      c.setAttribute("cx", p.x);
      c.setAttribute("cy", p.y);
      c.setAttribute("r", 4);
      c.setAttribute("class", "node " + (cls || ""));
      return c;
    }
    function makeLink(a, b, cls) {
      const l = document.createElementNS(SVG_NS, "line");
      l.setAttribute("x1", a.x); l.setAttribute("y1", a.y);
      l.setAttribute("x2", b.x); l.setAttribute("y2", b.y);
      l.setAttribute("class", "link " + (cls || ""));
      return l;
    }

    // 기존 응답들을 순서대로 점선으로 연결해서 그림
    function renderAll(animate) {
      svg.innerHTML = "";
      const start = Math.max(0, totalCount - MAX_NODES);
      for (let i = start; i < totalCount; i++) {
        const p = posOf(i);
        if (i > start) {
          const link = makeLink(posOf(i - 1), p, animate ? "fade" : "");
          if (animate) link.style.animationDelay = (i - start) * 40 + "ms";
          svg.appendChild(link);
        }
        const node = makeNode(p, animate ? "fade" : "");
        if (animate) node.style.animationDelay = (i - start) * 40 + "ms";
        svg.appendChild(node);
      }
    }

    // 새 응답: 이전 점에서 새 점까지 점선이 쭉 뻗어나감
    function connectNew() {
      const newIndex = totalCount;      // 새 점의 번호
      const to = posOf(newIndex);
      const from = newIndex > 0 ? posOf(newIndex - 1) : to;

      // 새 점이 들어오면 맨 앞(가장 오래된) 점이 밀려나지 않도록 그대로 추가
      const line = makeLink(from, from);
      svg.insertBefore(line, svg.firstChild);

      const duration = 1400;
      const t0 = performance.now();

      function step(now) {
        const t = Math.min((now - t0) / duration, 1);
        const e = 1 - Math.pow(1 - t, 3); // easeOutCubic
        line.setAttribute("x2", from.x + (to.x - from.x) * e);
        line.setAttribute("y2", from.y + (to.y - from.y) * e);
        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          svg.appendChild(makeNode(to, "latest"));
        }
      }
      requestAnimationFrame(step);

      totalCount += 1;
    }

    /* ---------- 시작: 기존 응답 개수 불러오기 ---------- */
    async function loadCount() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        if (data.ok) totalCount = Number(data.count) || 0;
      } catch (e) {
        console.error(e); // 실패해도 폼은 정상 동작
      }
      renderAll(true);
    }
    loadCount();

    window.addEventListener("resize", () => renderAll(false));

    /* ---------- 전송 ---------- */
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (submitting) return;

      const response = input.value.trim();

      if (!response) {
        status.textContent = "응답을 입력해주세요.";
        return;
      }
      if (response.length > 5000) {
        status.textContent = "응답은 5000자 이내로 작성해주세요.";
        return;
      }

      submitting = true;
      button.disabled = true;
      button.textContent = "전송 중...";
      status.textContent = "";

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=UTF-8" },
          body: JSON.stringify({ response: response })
        });

        const result = await res.json();
        if (!result.ok) throw new Error(result.error || "저장 실패");

        // 폼 사라지고 → 점선이 이어짐
        formWrap.classList.add("hide");
        setTimeout(connectNew, 500);
        setTimeout(() => {
          thanks.innerHTML =
            "당신의 응답이 " + (totalCount - 1) + "개의 응답과 이어졌어요.";
          thanks.classList.add("show");
        }, 2000);

      } catch (error) {
        console.error(error);
        submitting = false;
        button.disabled = false;
        button.textContent = "전송";
        status.textContent = "전송하지 못했습니다. 잠시 후 다시 시도해주세요.";
      }
    });
  </script>
</body>
</html>
