<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f5">
  <title>전시 &lt;설명하지 않는다&gt; 응답 아카이브</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f7f7f5;
      color: #222;
      font-family: Arial, "Noto Sans KR", sans-serif;
      overflow: hidden;
    }

    /* 점 + 점선 배경 */
    #web {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .node { fill: #222; transform-box: fill-box; transform-origin: center; }
    .node.fade { animation: pop .6s ease both; }
    .node.latest { animation: pop .6s ease both, pulse 2s ease-in-out .8s infinite; }
    .link {
      stroke: #222;
      stroke-width: 1.5;
      stroke-linecap: round;
      stroke-dasharray: 1 7;
      opacity: .45;
    }
    .link.fade { animation: fadeLine .8s ease both; }

    /* 아직 이어지지 않은 "다음 연결" 미리보기: 흐린 점선 + 속이 빈 점 */
    .link.ghost {
      opacity: .22;
      stroke-dasharray: 1 12;
      animation: ghostLine 1s ease both;
    }
    .node.ghost {
      fill: none;
      stroke: #222;
      stroke-width: 1.2;
      opacity: .4;
      animation: ghostIn 1s ease both, ghostPulse 2.6s ease-in-out 1s infinite;
    }

    @keyframes pop {
      from { opacity: 0; transform: scale(0); }
      to   { opacity: 1; transform: scale(1); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: .35; }
    }
    @keyframes fadeLine {
      from { opacity: 0; }
      to   { opacity: .45; }
    }
    @keyframes ghostLine {
      from { opacity: 0; }
      to   { opacity: .22; }
    }
    @keyframes ghostIn {
      from { opacity: 0; transform: scale(0); }
      to   { opacity: .4; transform: scale(1); }
    }
    @keyframes ghostPulse {
      0%, 100% { opacity: .25; transform: scale(.9); }
      50%      { opacity: .55; transform: scale(1.2); }
    }

    main {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 440px;
      transition: opacity .6s ease, transform .6s ease;
    }
    main.hide {
      opacity: 0;
      transform: translateY(12px);
      pointer-events: none;
    }

    h1 {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 200px;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
      font: inherit;
      font-size: 16px;
      line-height: 1.7;
      resize: vertical;
      outline: none;
    }
    textarea:focus { border-color: #555; }

    #submitButton {
      width: 100%;
      margin-top: 14px;
      padding: 16px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }
    #submitButton:disabled { opacity: .5; cursor: wait; }

    #status {
      min-height: 24px;
      margin-top: 12px;
      color: #b42318;
      font-size: 13px;
      line-height: 1.6;
    }

    /* 전송 후 문구 + 돌아가기 버튼 */
    #after {
      position: fixed;
      left: 0; right: 0; bottom: 8vh;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease;
    }
    #after.show { opacity: 1; }
    #after.show #backButton { pointer-events: auto; }

    #thanks {
      max-width: 520px;
      padding: 0 24px;
      text-align: center;
      color: #555;
      font-size: 14px;
      line-height: 1.8;
      white-space: pre-line;   /* \n 줄바꿈 반영 */
      word-break: keep-all;
    }

    #backButton {
      padding: 12px 22px;
      border: 1px solid #222;
      border-radius: 999px;
      background: rgba(247, 247, 245, .9);
      color: #222;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      pointer-events: none;
      transition: background .2s ease, color .2s ease;
    }
    #backButton:hover { background: #222; color: #fff; }
  </style>
</head>

<body>
  <svg id="web" aria-hidden="true"></svg>

  <main id="formWrap">
    <h1>응답해주세요.</h1>
    <form id="responseForm">
      <textarea
        id="response"
        name="response"
        maxlength="5000"
        placeholder="응답을 입력해주세요."
        required
      ></textarea>

      <button id="submitButton" type="submit">응답하기</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
  </main>

  <div id="after">
    <div id="thanks"></div>
    <button id="backButton" type="button">다시 작성하기</button>
  </div>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbxOm-8YuZq9ratK6XxpY0rDaHTKAsN9xumeHzvdQh-37kZd59nWCaFRoVCDmbvmCBKe/exec";

    const MAX_NODES = 80;   // 화면에 그릴 최대 점 개수 (최근 것만)
    const BRANCHES = true;  // true: 직전 점 외에 이전 응답 하나와도 연결 (그물 모양)
    const SVG_NS = "http://www.w3.org/2000/svg";

    const form = document.getElementById("responseForm");
    const input = document.getElementById("response");
    const button = document.getElementById("submitButton");
    const statusEl = document.getElementById("status");
    const formWrap = document.getElementById("formWrap");
    const after = document.getElementById("after");
    const thanks = document.getElementById("thanks");
    const backButton = document.getElementById("backButton");
    const svg = document.getElementById("web");

    let submitting = false;
    let totalCount = 0;   // 시트에 쌓인 응답 수
    let timers = [];
    let ghostTimer = null;

    /* ---------- 위치: 번호마다 항상 같은 자리 ---------- */
    function rand(seed) {
      let t = (seed += 0x6d2b79f5);
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    function posOf(index) {
      const w = window.innerWidth, h = window.innerHeight;
      return {
        x: w * (0.06 + rand(index * 2 + 1) * 0.88),
        y: h * (0.08 + rand(index * 2 + 2) * 0.84)
      };
    }

    // i번째 응답이 (직전 점 말고) 추가로 이어지는 이전 응답 번호. 없으면 -1
    // 번호로 정해지므로 새로고침해도 같은 그물이 나온다.
    function branchOf(i) {
      if (!BRANCHES || i < 2) return -1;
      return Math.floor(rand(i * 7 + 3) * (i - 1)); // 0 ~ i-2
    }

    /* ---------- 그리기 ---------- */
    function makeNode(p, cls) {
      const c = document.createElementNS(SVG_NS, "circle");
      c.setAttribute("cx", p.x);
      c.setAttribute("cy", p.y);
      c.setAttribute("r", 4);
      c.setAttribute("class", "node " + (cls || ""));
      return c;
    }
    function makeLink(a, b, cls) {
      const l = document.createElementNS(SVG_NS, "line");
      l.setAttribute("x1", a.x); l.setAttribute("y1", a.y);
      l.setAttribute("x2", b.x); l.setAttribute("y2", b.y);
      l.setAttribute("class", "link " + (cls || ""));
      return l;
    }

    // 다음 사람이 이어질 자리를 흐린 점선과 빈 점으로 미리 보여줌
    function clearGhost() {
      svg.querySelectorAll(".ghost").forEach((n) => n.remove());
    }
    function drawGhost() {
      clearGhost();
      if (totalCount === 0) return;
      const a = posOf(totalCount - 1);
      const b = posOf(totalCount);
      svg.insertBefore(makeLink(a, b, "ghost"), svg.firstChild);
      svg.appendChild(makeNode(b, "ghost"));
    }

    // 기존 응답들을 순서대로 점선으로 연결해서 그림 (마지막 점은 깜빡임)
    function renderAll(animate) {
      clearTimeout(ghostTimer);
      svg.innerHTML = "";
      const start = Math.max(0, totalCount - MAX_NODES);

      for (let i = start; i < totalCount; i++) {
        const p = posOf(i);
        const delay = (i - start) * 40 + "ms";

        if (i > start) {
          const link = makeLink(posOf(i - 1), p, animate ? "fade" : "");
          if (animate) link.style.animationDelay = delay;
          svg.appendChild(link);
        }

        const b = branchOf(i);
        if (b >= start) {
          const bLink = makeLink(posOf(b), p, animate ? "fade" : "");
          if (animate) bLink.style.animationDelay = delay;
          svg.appendChild(bLink);
        }

        const isLast = i === totalCount - 1;
        const cls = isLast ? "latest" : (animate ? "fade" : "");
        const node = makeNode(p, cls);
        if (animate) node.style.animationDelay = delay;
        svg.appendChild(node);
      }

      // 점들이 다 그려진 뒤에 "다음 연결" 미리보기 등장
      const wait = animate ? (totalCount - start) * 40 + 600 : 0;
      ghostTimer = setTimeout(drawGhost, wait);
    }

    // 새 응답: 이전 점에서 새 점까지 점선이 쭉 뻗어나감
    function connectNew() {
      const newIndex = totalCount;
      const to = posOf(newIndex);
      const from = newIndex > 0 ? posOf(newIndex - 1) : to;

      // 미리보기 점선은 지금 이어지는 선이 되므로 치우고, 이전 깜빡임은 멈춤
      clearTimeout(ghostTimer);
      clearGhost();
      svg.querySelectorAll(".node.latest").forEach((n) => {
        n.setAttribute("class", "node");
      });

      const line = makeLink(from, from);
      svg.insertBefore(line, svg.firstChild);

      // 추가 연결선 (이전 응답 중 하나와)
      const b = branchOf(newIndex);
      const visibleStart = Math.max(0, newIndex + 1 - MAX_NODES);
      if (b >= visibleStart) {
        const bLink = makeLink(posOf(b), to, "fade");
        bLink.style.animationDelay = "900ms";
        svg.insertBefore(bLink, svg.firstChild);
      }

      const duration = 1400;
      const t0 = performance.now();

      function step(now) {
        const t = Math.min((now - t0) / duration, 1);
        const e = 1 - Math.pow(1 - t, 3); // easeOutCubic
        line.setAttribute("x2", from.x + (to.x - from.x) * e);
        line.setAttribute("y2", from.y + (to.y - from.y) * e);
        if (t < 1) {
          requestAnimationFrame(step);
        } else {
          svg.appendChild(makeNode(to, "latest"));
          drawGhost(); // 새 점 뒤로 또 이어질 가능성
        }
      }
      requestAnimationFrame(step);

      totalCount += 1;
    }

    /* ---------- 시트의 응답 개수 불러오기 ---------- */
    async function fetchCount() {
      try {
        const res = await fetch(SCRIPT_URL);
        const data = await res.json();
        if (data.ok) totalCount = Number(data.count) || 0;
      } catch (e) {
        console.error(e); // 실패해도 폼은 정상 동작
      }
    }

    (async () => {
      await fetchCount();
      renderAll(true);
    })();

    window.addEventListener("resize", () => renderAll(false));

    /* ---------- 문장 줄이기 ---------- */
    function clip(text, max) {
      const chars = Array.from(text.replace(/\s+/g, " "));
      return chars.length > max ? chars.slice(0, max).join("") + "…" : chars.join("");
    }

    /* ---------- 전송 ---------- */
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (submitting) return;

      const response = input.value.trim();

      if (!response) {
        statusEl.textContent = "응답을 입력해주세요.";
        return;
      }
      if (response.length > 5000) {
        statusEl.textContent = "응답은 5000자 이내로 작성해주세요.";
        return;
      }

      submitting = true;
      button.disabled = true;
      button.textContent = "전송 중...";
      statusEl.textContent = "";

      try {
        const res = await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=UTF-8" },
          body: JSON.stringify({ response: response })
        });

        const result = await res.json();
        if (!result.ok) throw new Error(result.error || "저장 실패");

        // 서버가 알려준 정확한 순번으로 맞춤 (그 사이 다른 사람이 제출했을 수 있음)
        if (Number(result.count) > 0) {
          totalCount = Number(result.count) - 1; // 방금 응답을 뺀, 이전 응답 수
          renderAll(false);
        }
        const prev = String(result.prev || "").trim(); // 바로 전 사람의 문장

        // 폼 사라지고 → 점선이 이어짐 → 문구와 버튼 등장
        formWrap.classList.add("hide");
        timers.push(setTimeout(connectNew, 500));
        timers.push(setTimeout(() => {
          const before = totalCount - 1; // 방금 응답 이전에 있던 응답 수
          if (before > 0 && prev) {
            thanks.textContent =
              "당신의 응답이 이 문장 뒤에 이어졌어요.\n" +
              "“" + clip(prev, 60) + "”\n" +
              "지금까지 " + before + "개의 응답이 이어져 있어요.";
          } else if (before > 0) {
            thanks.textContent = "당신의 응답이 " + before + "개의 응답과 이어졌어요.";
          } else {
            thanks.textContent = "첫 번째 응답이에요.";
          }
          after.classList.add("show");
        }, 2000));

      } catch (error) {
        console.error(error);
        submitting = false;
        button.disabled = false;
        button.textContent = "응답하기";
        statusEl.textContent = "전송하지 못했습니다. 잠시 후 다시 시도해주세요.";
      }
    });

    /* ---------- 처음 화면으로 돌아가기 ---------- */
    backButton.addEventListener("click", async () => {
      timers.forEach(clearTimeout);
      timers = [];

      after.classList.remove("show");

      // 입력창 초기화
      input.value = "";
      statusEl.textContent = "";
      button.disabled = false;
      button.textContent = "응답하기";
      submitting = false;

      // 그 사이 다른 사람이 남긴 응답까지 반영해서 다시 그림
      await fetchCount();
      renderAll(true);

      formWrap.classList.remove("hide");
      setTimeout(() => input.focus(), 600);
    });
  </script>
</body>
</html>
