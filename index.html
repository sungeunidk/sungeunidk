
<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    :root {
      color-scheme: dark;
      --bg: #101010;
      --panel: #1b1b1b;
      --text: #f1eee7;
      --muted: #858585;
      --line: #68645d;
      --accent: #d8ff65;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    header {
      padding: 30px 36px 20px;
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 20px;
    }

    .eyebrow {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.18em;
      margin-bottom: 12px;
    }

    h1 {
      font-size: clamp(25px, 4vw, 48px);
      font-weight: 400;
      margin: 0;
      letter-spacing: -0.05em;
    }

    #count {
      color: var(--accent);
      font-size: 15px;
      white-space: nowrap;
    }

    .description {
      margin: 0;
      padding: 0 36px 26px;
      color: #aaa69f;
      font-size: 13px;
      line-height: 1.8;
    }

    #status {
      padding: 0 36px 18px;
      font-size: 11px;
      color: var(--muted);
    }

    #viewport {
      overflow-x: auto;
      overflow-y: hidden;
      padding: 25px 36px 60px;
      min-height: 300px;
      scrollbar-color: #565656 var(--bg);
    }

    #network {
      display: flex;
      align-items: center;
      width: max-content;
      min-height: 220px;
    }

    .node {
      width: 220px;
      min-height: 190px;
      flex: 0 0 220px;
      border: 1px solid #45433e;
      background: var(--panel);
      padding: 19px;
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .node:first-child {
      border-color: var(--accent);
    }

    .node-index {
      color: var(--accent);
      font-size: 11px;
      letter-spacing: 0.12em;
    }

    .node-text {
      font-size: 16px;
      line-height: 1.8;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    .node-time {
      color: var(--muted);
      font-size: 10px;
      margin-top: auto;
    }

    .connector {
      width: 55px;
      height: 1px;
      background: var(--line);
      flex: 0 0 55px;
      position: relative;
    }

    .connector::after {
      content: "";
      position: absolute;
      right: 0;
      top: -4px;
      width: 8px;
      height: 8px;
      border-top: 1px solid var(--line);
      border-right: 1px solid var(--line);
      transform: rotate(45deg);
    }

    #empty {
      color: var(--muted);
      font-size: 14px;
      padding: 40px 0;
    }

    footer {
      padding: 18px 36px;
      color: #777;
      border-top: 1px solid #292929;
      font-size: 11px;
      line-height: 1.8;
    }

    @media (max-width: 600px) {
      header {
        padding: 24px 20px 16px;
      }

      .description,
      #status {
        padding-left: 20px;
        padding-right: 20px;
      }

      #viewport {
        padding-left: 20px;
        padding-right: 20px;
      }

      footer {
        padding-left: 20px;
        padding-right: 20px;
      }
    }
  </style>
</head>

<body>
  <header>
    <div>
      <div class="eyebrow">A CONTINUOUS RESPONSE</div>
      <h1>응답과 응답 사이</h1>
    </div>
    <div id="count">0 RESPONSES</div>
  </header>

  <p class="description">
    하나의 응답은 다음 응답과 연결된다.<br>
    연결은 계속되고, 아직 도착하지 않은 응답은 열려 있다.
  </p>

  <div id="status">연결망을 불러오는 중...</div>

  <main id="viewport">
    <div id="network">
      <div id="empty">아직 도착한 응답이 없습니다.</div>
    </div>
  </main>

  <footer>
    각 카드는 하나의 응답을 나타냅니다.
    선은 제출 순서에 따른 연결을 나타냅니다.
  </footer>

  <script>
    const network = document.getElementById("network");
    const count = document.getElementById("count");
    const status = document.getElementById("status");

    let lastSignature = "";

    function makeElement(tag, className, text) {
      const el = document.createElement(tag);

      if (className) el.className = className;
      if (text !== undefined) el.textContent = text;

      return el;
    }

    function formatTime(value) {
      if (!value) return "";

      const date = new Date(value);

      if (Number.isNaN(date.getTime())) return "";

      return date.toLocaleString("ko-KR", {
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function renderGraph(data) {
      if (!data || !data.ok || !Array.isArray(data.nodes)) {
        throw new Error("연결망 데이터 형식이 올바르지 않습니다.");
      }

      const nodes = data.nodes;

      // 데이터가 달라졌을 때만 화면을 다시 그린다.
      const signature = nodes
        .map(node => node.id + ":" + node.previousId)
        .join("|");

      count.textContent = nodes.length + " RESPONSES";

      if (signature === lastSignature) {
        status.textContent = "연결망 실시간 업데이트 · " +
          new Date().toLocaleTimeString("ko-KR");
        return;
      }

      lastSignature = signature;
      network.replaceChildren();

      if (nodes.length === 0) {
        network.appendChild(
          makeElement("div", "node-text", "아직 도착한 응답이 없습니다.")
        );

        status.textContent = "새 응답을 기다리는 중";
        return;
      }

      // 이전 응답 ID를 기준으로 연결 순서를 구성한다.
      const byId = new Map(nodes.map(node => [node.id, node]));
      const children = new Map();

      nodes.forEach(node => {
        if (!children.has(node.previousId)) {
          children.set(node.previousId, []);
        }

        if (node.previousId && byId.has(node.previousId)) {
          children.get(node.previousId).push(node);
        }
      });

      // 가장 앞선 응답부터 연결을 따라간다.
      const ordered = [];
      const visited = new Set();

      function walk(node) {
        if (!node || visited.has(node.id)) return;

        visited.add(node.id);
        ordered.push(node);

        const nextNodes = children.get(node.id) || [];

        nextNodes.forEach(walk);
      }

      const roots = nodes.filter(
        node => !node.previousId || !byId.has(node.previousId)
      );

      roots.forEach(walk);

      // 연결이 끊긴 데이터도 화면에서 누락하지 않는다.
      nodes.forEach(node => {
        if (!visited.has(node.id)) walk(node);
      });

      ordered.forEach((node, index) => {
        if (index > 0) {
          const previous = ordered[index - 1];

          const isConnected =
            node.previousId === previous.id;

          const connector = makeElement(
            "div",
            "connector"
          );

          if (!isConnected) {
            connector.style.background = "transparent";
            connector.style.borderTop = "1px dashed #68645d";
          }

          network.appendChild(connector);
        }

        const card = makeElement("article", "node");

        card.appendChild(
          makeElement(
            "div",
            "node-index",
            "RESPONSE " + String(index + 1).padStart(3, "0")
          )
        );

        card.appendChild(
          makeElement("div", "node-text", node.text)
        );

        card.appendChild(
          makeElement("div", "node-time", formatTime(node.timestamp))
        );

        network.appendChild(card);
      });

      status.textContent =
        "연결망 실시간 업데이트 · " +
        new Date().toLocaleTimeString("ko-KR");

      // 최신 응답을 바로 확인할 수 있도록 끝으로 이동한다.
      document.getElementById("viewport").scrollLeft =
        document.getElementById("viewport").scrollWidth;
    }

    function loadGraph() {
      google.script.run
        .withSuccessHandler(renderGraph)
        .withFailureHandler(error => {
          status.textContent =
            "연결망을 불러오지 못했습니다. " +
            (error && error.message ? error.message : "");
        })
        .getGraphData();
    }

    loadGraph();
    setInterval(loadGraph, 5000);
  </script>
</body>
</html>
