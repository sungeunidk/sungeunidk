
<!DOCTYPE html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    * { box-sizing: border-box; }

    :root {
      --paper: #fdfdfb;
      --ink: #22221f;
      --muted: #92928b;
      --line: #deded8;
    }

    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: "Noto Sans KR", Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      padding: 32px 5vw;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .eyebrow {
      font-size: 10px;
      letter-spacing: .2em;
      color: var(--muted);
    }

    .index {
      font-size: 11px;
      color: var(--muted);
    }

    main {
      width: min(680px, 88vw);
      margin: 12vh auto 0;
      padding-bottom: 100px;
    }

    .number {
      font-family: Georgia, serif;
      font-size: 13px;
      color: #a1a198;
      margin-bottom: 28px;
    }

    h1 {
      font-weight: 400;
      font-size: clamp(30px, 5vw, 54px);
      line-height: 1.45;
      letter-spacing: -.055em;
      margin: 0 0 24px;
    }

    .intro {
      color: #77776f;
      font-size: 14px;
      line-height: 2;
      margin-bottom: 60px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 190px;
      resize: vertical;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-top: 1px solid var(--line);
      background: transparent;
      border-radius: 0;
      padding: 24px 0;
      color: var(--ink);
      font: inherit;
      font-size: 17px;
      line-height: 1.9;
      outline: none;
    }

    textarea::placeholder {
      color: #b6b6ae;
    }

    textarea:focus {
      border-bottom-color: #66665e;
    }

    .bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      margin-top: 22px;
    }

    #hint {
      color: var(--muted);
      font-size: 11px;
      line-height: 1.7;
    }

    button {
      appearance: none;
      border: 1px solid #262621;
      background: transparent;
      color: #262621;
      padding: 13px 24px;
      font: inherit;
      font-size: 12px;
      cursor: pointer;
      transition: background .2s, color .2s;
    }

    button:hover {
      background: #262621;
      color: white;
    }

    button:disabled {
      opacity: .45;
      cursor: wait;
    }

    footer {
      position: fixed;
      bottom: 0;
      width: 100%;
      padding: 18px 5vw;
      background: rgba(253,253,251,.92);
      border-top: 1px solid #eeeeea;
      color: #9b9b93;
      font-size: 10px;
      letter-spacing: .04em;
    }

    @media (max-width: 600px) {
      header { padding: 24px 6vw; }
      main { margin-top: 9vh; }
      .intro { margin-bottom: 42px; }
      .bottom { align-items: flex-end; }
      button { padding: 12px 17px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">A CONTINUOUS RESPONSE</div>
    <div class="index">AN OPEN QUESTION · 01</div>
  </header>

  <main>
    <div class="number">01 / BEGIN</div>

    <h1>지금 당신의 마음에<br>남아 있는 것은 무엇인가요?</h1>

    <p class="intro">
      정리되지 않은 생각이어도 괜찮습니다.<br>
      다른 사람에게 전하고 싶은 말이나<br>
      아직 스스로에게도 설명하기 어려운 마음을 적어 주세요.
    </p>

    <form id="responseForm">
      <textarea
        id="response"
        maxlength="5000"
        placeholder="여기에 당신의 응답을 남겨 주세요."
        required
      ></textarea>

      <div class="bottom">
        <div id="hint">당신의 응답은 다른 응답과 연결됩니다.</div>
        <button id="submitButton" type="submit">남기기 ↗</button>
      </div>
    </form>
  </main>

  <footer>응답과 응답 사이 · AN OPEN NETWORK OF THOUGHTS</footer>

  <script>
    const form = document.getElementById("responseForm");
    const input = document.getElementById("response");
    const button = document.getElementById("submitButton");
    const hint = document.getElementById("hint");

    form.addEventListener("submit", function(event) {
      event.preventDefault();

      const response = input.value.trim();

      if (!response) {
        hint.textContent = "응답을 먼저 작성해 주세요.";
        input.focus();
        return;
      }

      button.disabled = true;
      hint.textContent = "응답을 연결하고 있습니다…";

      google.script.run
        .withSuccessHandler(function(result) {
          if (!result || !result.ok) {
            button.disabled = false;
            hint.textContent =
              result && result.error
                ? result.error
                : "저장하지 못했습니다. 다시 시도해 주세요.";
            return;
          }

          // 작성한 응답 ID를 완료 화면으로 전달
          const url = new URL(window.location.href);
          url.searchParams.set("page", "done");
          url.searchParams.set("id", result.id || "");

          window.top.location.href = url.toString();
        })
        .withFailureHandler(function(error) {
          button.disabled = false;
          hint.textContent =
            "오류가 발생했습니다. " +
            (error && error.message ? error.message : "다시 시도해 주세요.");
        })
        .submitResponse(response);
    });
  </script>
</body>
</html>
