
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f7f5">
  <title>응답해주세요</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f7f7f5;
      color: #222;
      font-family: Arial, "Noto Sans KR", sans-serif;
    }

    main { width: 100%; max-width: 440px; }

    h1 {
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -1px;
      margin-bottom: 12px;
    }

    .description {
      color: #777;
      font-size: 14px;
      line-height: 1.7;
      margin-bottom: 28px;
    }

    textarea {
      display: block;
      width: 100%;
      min-height: 200px;
      padding: 16px;
      border: 1px solid #ddd;
      border-radius: 10px;
      background: #fff;
      font: inherit;
      font-size: 16px;
      line-height: 1.7;
      resize: vertical;
      outline: none;
    }

    textarea:focus { border-color: #555; }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 16px;
      border: 0;
      border-radius: 10px;
      background: #222;
      color: white;
      font-size: 15px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: wait;
    }

    #status {
      min-height: 24px;
      margin-top: 12px;
      color: #b42318;
      font-size: 13px;
      line-height: 1.6;
    }
  </style>
</head>

<body>
  <main>
    <h1>응답해주세요</h1>
    <div class="description">
      전달하고 싶은 응답을 작성해주세요.
    </div>

    <form id="responseForm">
      <textarea
        id="response"
        name="response"
        maxlength="5000"
        placeholder="응답을 입력해주세요."
        required
      ></textarea>

      <button id="submitButton" type="submit">
        전송
      </button>

      <div id="status" role="status" aria-live="polite"></div>
    </form>
  </main>

  <script>
    const SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbyoHtdLvuaTJhzKpQI1hMdb3NZg5GB3uphs5hKPWZwXHEjPvxO2_d5-Nkv6Q4Ih-oCv/exec";

    const form = document.getElementById("responseForm");
    const input = document.getElementById("response");
    const button = document.getElementById("submitButton");
    const status = document.getElementById("status");

    let submitting = false;

    form.addEventListener("submit", async (event) => {
      event.preventDefault();

      if (submitting) return;

      const response = input.value.trim();

      if (!response) {
        status.textContent = "응답을 입력해주세요.";
        return;
      }

      if (response.length > 5000) {
        status.textContent = "응답은 5000자 이내로 작성해주세요.";
        return;
      }

      submitting = true;
      button.disabled = true;
      button.textContent = "전송 중...";
      status.textContent = "";

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: {
            "Content-Type": "text/plain;charset=UTF-8"
          },
          body: JSON.stringify({
            response: response
          })
        });

        window.location.href = "done.html";

      } catch (error) {
        submitting = false;
        button.disabled = false;
        button.textContent = "전송";
        status.textContent =
          "전송하지 못했습니다. 인터넷 연결을 확인하고 다시 시도해주세요.";
      }
    });
  </script>
</body>
</html>
