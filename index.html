<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시니어 모델 더 비기닝</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <style>
        :root {
            --gold-color: #D4AF37;
            --bg-color: #FFF9ED; /* 따뜻한 느낌의 연한 베이지 */
            --text-dark: #2c2c2c;
            --accent-red: #E74C3C;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.5;
        }

        /* 모바일 전용 컨테이너 */
        .mobile-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #fff;
            box-shadow: 0 0 20px rgba(0,0,0,0.05);
            min-height: 100vh;
        }

        /* 상단 히어로 섹션 */
        .hero {
            padding: 40px 20px 30px;
            text-align: center;
            background: linear-gradient(135deg, #232526, #414345); /* 고급스러운 어두운 그라데이션 */
            color: #fff;
            border-bottom-left-radius: 30px;
            border-bottom-right-radius: 30px;
        }

        .hero-sub {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 10px;
        }

        .hero-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin: 0 0 20px 0;
            line-height: 1.3;
            color: #FFD700; /* 제목도 금빛 포인트 */
        }

        /* 핵심 가격 섹션 (은은한 금빛) */
        .price-box {
            background-color: #fff;
            margin: -30px 20px 0; /* 위로 살짝 겹치게 */
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            position: relative;
        }

        .package-name {
            font-size: 1.3rem;
            font-weight: bold;
            color: #555;
            margin-bottom: 15px;
        }

        .gold-number {
            font-size: 3.5rem;
            font-weight: 900;
            /* 너무 번쩍거리지 않는 고급스러운 골드 그라데이션 */
            background: linear-gradient(to right, #AA771C, #FBF5B7, #AA771C);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 4s linear infinite; /* 천천히 은은하게 빛남 */
        }

        @keyframes shimmer {
            to { background-position: 200% center; }
        }

        /* 긴급 알림 박스 (덜 공격적인 디자인) */
        .urgency-alert {
            margin-top: 20px;
            background-color: #FFF0F0;
            color: var(--accent-red);
            padding: 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            display: inline-block;
            border: 2px solid var(--accent-red);
        }

        /* 상세 내용 섹션 */
        .content-section {
            padding: 40px 25px;
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: bold;
            margin-bottom: 25px;
            text-align: center;
        }

        .benefit-list {
            list-style: none;
            padding: 0;
        }

        .benefit-list li {
            font-size: 1.3rem;
            margin-bottom: 20px;
            padding-left: 40px;
            position: relative;
            font-weight: 500;
        }

        /* 체크 아이콘 */
        .benefit-list li::before {
            content: '👑';
            position: absolute;
            left: 0;
            top: 2px;
            font-size: 1.4rem;
        }

        /* 하단 고정 버튼 영역 */
        .fixed-bottom-cta {
            position: sticky;
            bottom: 0;
            padding: 20px;
            background: #fff;
            box-shadow: 0 -5px 15px rgba(0,0,0,0.05);
            text-align: center;
        }

        .call-button {
            display: block;
            width: 100%;
            padding: 20px;
            background: linear-gradient(to right, #D4AF37, #C5A028);
            color: white;
            font-size: 1.5rem;
            font-weight: 800;
            text-decoration: none;
            border-radius: 50px;
            box-shadow: 0 5px 15px rgba(212, 175, 55, 0.4);
            transition: transform 0.2s;
        }

        .call-button:active {
            transform: scale(0.98);
        }
        
        .call-subtext {
            display: block;
            font-size: 1rem;
            font-weight: normal;
            margin-top: 5px;
            opacity: 0.9;
        }

    </style>
</head>
<body>

    <div class="mobile-container">
        <header class="hero">
            <div class="hero-sub">"아직 늦지 않았습니다."</div>
            <h1 class="hero-title">당신의 가장 빛나는 순간<br>시니어 모델 데뷔 프로젝트</h1>
        </header>

        <section class="price-box">
            <div class="package-name">워킹 + 메이크업 + 화보 풀패키지</div>
            <div class="gold-number">1,000,000원</div>
            
            <div class="urgency-alert">
                🚨 1기 선착순 마감 임박 (잔여 3석)
            </div>
            <p style="color:#888; margin-top: 10px;">(추가 비용 없는 최종 금액입니다)</p>
        </section>

        <section class="content-section">
            <h2 class="section-title">무엇을 경험하게 되나요?</h2>
            <ul class="benefit-list">
                <li><strong>자세 교정 워킹:</strong> 당당해지는 걸음걸이</li>
                <li><strong>전문가 스타일링:</strong> 나에게 맞는 색과 메이크업</li>
                <li><strong>인생 화보 촬영:</strong> 자녀들이 놀랄 멋진 사진</li>
                <li><strong>새로운 친구들:</strong> 함께 꿈꾸는 멋진 동료들</li>
            </ul>
        </section>

        <div class="fixed-bottom-cta">
            <a href="tel:010-0000-0000" class="call-button">
                지금 바로 전화 상담하기
                <span class="call-subtext">복잡한 입력 없이, 통화로 신청하세요!</span>
            </a>
        </div>
    </div>

</body>
</html>
